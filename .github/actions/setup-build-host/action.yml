# SPDX-License-Identifier: GPL-3.0-or-later
name: Set up build host
description: Disk space, host tools, Python 3.13, Android NDK and qemu-aarch64 binfmt.
runs:
  using: composite
  steps:
    - name: Free disk space and create build root on /mnt
      shell: bash
      run: |
        df -h / /mnt
        # Large preinstalled toolchains this build never uses.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
                    /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
                    /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
        sudo mkdir -p "$BLA_BUILD" && sudo chown "$USER" "$BLA_BUILD"
        df -h / /mnt

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install host packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          ninja-build pkg-config patch ccache qemu-user-static binfmt-support file
        python3.13 -m pip install -q 'meson>=1.5'
        ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
        cmake --version | head -1

    - name: Android NDK
      shell: bash
      run: |
        ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
        if [[ ! -f "$ndk/source.properties" ]]; then
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
        fi
        echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
        grep Pkg.Revision "$ndk/source.properties"
